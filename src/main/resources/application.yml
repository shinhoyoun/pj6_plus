spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pj6_plus
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

## sql 로그 확인하기위해
logging:
  level:
    root: info
    org.hibernate.SQL: debug

server:
  tomcat:
    max-http-form-post-size: 100MB